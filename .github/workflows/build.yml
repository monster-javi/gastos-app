name: Build

# El código fuente vive en app/. GitHub Pages publica el index.html de la raíz
# (la app compilada en un solo archivo). Cada vez que cambia algo en app/,
# esto compila de nuevo y, si el resultado cambió, actualiza el index.html.

on:
  push:
    branches: ["main"]
    paths: ["app/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Update index.html
        run: |
          cp app/dist/index.html index.html
          if git diff --quiet -- index.html; then
            echo "index.html ya estaba al día."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Compilar app (index.html)"
            git push
          fi
